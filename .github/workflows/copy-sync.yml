# Multi-copy listings: put each pooled listing's picture right, every 15 min.
#
# A copy sells; eBay lowers the quantity itself, but the photograph still
# shows the copy that just went. This calls the app's /api/cron/copies, which
# moves each pooled listing's picture to the next copy owed to nobody
# (apps/app/lib/copysync.js). It is the backstop for eBay's own sale
# notification, and the only trigger until that is switched on.
#
# Here rather than in vercel.json because the Vercel plan runs scheduled jobs
# once a day. GitHub runs a schedule "about" when asked — often a few minutes
# late at busy times — which is fine for a backstop.
#
# Does nothing at all until COPY_SYNC is set on the comp-finder Vercel
# project ("dry" to log what it would do, "on" to send). Costs one eBay orders
# read per run and a revision only where a picture is wrong.
#
# Set up once, in Settings → Secrets and variables → Actions:
#   CRON_SECRET  (secret)    the same value as CRON_SECRET on comp-finder —
#                            the route refuses every call without it
#   APP_URL      (variable)  the app's production URL, e.g. https://comp-finder.vercel.app
name: Copy sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two sweeps at once would both decide the same picture is wrong and revise
# it twice. Harmless, but pointless; the second waits.
concurrency:
  group: copy-sync
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sweep
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::notice::CRON_SECRET (secret) or APP_URL (variable) is not set — nothing to call."
            exit 0
          fi
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $SECRET" "${APP_URL%/}/api/cron/copies")
          cat out.json; echo
          [ "$code" = "200" ] || { echo "::error::/api/cron/copies answered $code"; exit 1; }
